name: Build NL OS Premium Glass

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl wget xorriso squashfs-tools rsync isolinux syslinux-common syslinux-utils

      - name: Download Debian KDE Live
        run: |
          PAGE="https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/"
          ISO=$(curl -fsSL "$PAGE" | grep -o 'debian-live-[^"]*-amd64-kde.iso' | head -n 1)
          wget -O base.iso "$PAGE/$ISO"

      - name: Extract ISO
        run: |
          mkdir iso-root
          xorriso -osirrox on -indev base.iso -extract / iso-root
          chmod -R u+w iso-root

      - name: Extract filesystem
        run: |
          sudo unsquashfs -d squashfs-root iso-root/live/filesystem.squashfs

      - name: Fix sources
        run: |
          sudo rm -f squashfs-root/etc/apt/sources.list
          sudo mkdir -p squashfs-root/etc/apt/sources.list.d
          sudo find squashfs-root/etc/apt/sources.list.d -type f -delete || true

          sudo tee squashfs-root/etc/apt/sources.list >/dev/null <<'APT'
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          APT

          sudo cp /etc/resolv.conf squashfs-root/etc/resolv.conf

      - name: Install packages
        run: |
          sudo mount --bind /dev squashfs-root/dev
          sudo mount --bind /proc squashfs-root/proc
          sudo mount --bind /sys squashfs-root/sys

          sudo chroot squashfs-root /bin/bash -c "
            apt clean
            apt update
            apt install -y python3-pyqt5 gamemode mangohud
          "

          sudo umount -lf squashfs-root/dev || true
          sudo umount -lf squashfs-root/proc || true
          sudo umount -lf squashfs-root/sys || true

      - name: Add NL files
        run: |
          sudo mkdir -p squashfs-root/opt/nl-os/premium
          sudo cp -R nl-os/premium/* squashfs-root/opt/nl-os/premium/

          sudo mkdir -p squashfs-root/usr/local/bin
          sudo cp nl-os/premium/scripts/nl-premium-visual-init squashfs-root/usr/local/bin/nl-premium-visual-init
          sudo cp nl-os/premium/scripts/nl-control-center squashfs-root/usr/local/bin/nl-control-center
          sudo cp nl-os/premium/scripts/nl-boost squashfs-root/usr/local/bin/nl-boost

          sudo chmod +x squashfs-root/usr/local/bin/nl-premium-visual-init
          sudo chmod +x squashfs-root/usr/local/bin/nl-control-center
          sudo chmod +x squashfs-root/usr/local/bin/nl-boost

      - name: Configure session
        run: |
          sudo mkdir -p squashfs-root/etc/skel/.config/autostart
          sudo mkdir -p squashfs-root/etc/skel/.local/share/applications
          sudo mkdir -p squashfs-root/etc/skel/Desktop

          sudo tee squashfs-root/etc/skel/.config/autostart/nl-premium-visual-init.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NL Premium Visual Init
          Exec=nl-premium-visual-init
          Hidden=false
          NoDisplay=true
          X-GNOME-Autostart-enabled=true
          DESKTOP

          sudo tee squashfs-root/etc/skel/.local/share/applications/nl-control-center.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NL Control Center
          Exec=nl-control-center
          Icon=preferences-system
          Terminal=false
          Categories=System;
          DESKTOP

          sudo tee squashfs-root/etc/skel/Desktop/NL-Control-Center.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NL Control Center
          Exec=nl-control-center
          Icon=preferences-system
          Terminal=false
          Categories=System;
          DESKTOP

          sudo chmod +x squashfs-root/etc/skel/Desktop/NL-Control-Center.desktop

          sudo rm -f squashfs-root/etc/skel/Desktop/Install*.desktop || true
          sudo rm -f squashfs-root/etc/skel/Desktop/Debian*.desktop || true
          sudo rm -f squashfs-root/usr/share/applications/*debian*installer*.desktop || true
          sudo rm -f squashfs-root/usr/share/applications/*calamares*.desktop || true

          sudo tee squashfs-root/etc/hostname >/dev/null <<'HOST'
          nlos-premium
          HOST

          sudo tee squashfs-root/etc/issue >/dev/null <<'ISSUE'
          NL OS Premium \n \l
          ISSUE

          sudo sed -i 's/Debian/NL OS/g; s/debian/NL OS/g' squashfs-root/etc/os-release || true

      - name: Create boot menu
        run: |
          sudo mkdir -p iso-root/boot/grub

          sudo tee iso-root/boot/grub/grub.cfg >/dev/null <<'GRUB'
          set default=0
          set timeout=4

          insmod all_video
          insmod gfxterm
          set gfxmode=auto
          terminal_output gfxterm

          set menu_color_normal=white/black
          set menu_color_highlight=black/white

          menuentry "NL OS Premium Glass" {
            linux /live/vmlinuz boot=live components quiet splash loglevel=0 systemd.show_status=false username=user hostname=nlos-premium
            initrd /live/initrd.img
          }

          menuentry "NL OS Premium Glass - Safe Graphics" {
            linux /live/vmlinuz boot=live components nomodeset quiet splash loglevel=0 systemd.show_status=false username=user hostname=nlos-premium
            initrd /live/initrd.img
          }
          GRUB

          sudo find iso-root -type f \( -name "*.cfg" -o -name "*.txt" \) -exec sed -i 's/Debian/NL OS/g; s/debian/NL OS/g' {} \; || true

      - name: Repack filesystem
        run: |
          sudo rm -f iso-root/live/filesystem.squashfs
          sudo mksquashfs squashfs-root iso-root/live/filesystem.squashfs -comp xz
          sudo du -sx --block-size=1 squashfs-root | cut -f1 | sudo tee iso-root/live/filesystem.size

      - name: Build ISO
        run: |
          cd iso-root
          sudo xorriso -as mkisofs \
            -r -V "NLOS_GLASS" \
            -o ../NL-OS-Premium-Glass.iso \
            -J -joliet-long \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -partition_offset 16 \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NL-OS-Premium-Glass
          path: NL-OS-Premium-Glass.iso
