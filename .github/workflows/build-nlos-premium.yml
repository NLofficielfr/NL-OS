name: Build NLOS Premium

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl wget xorriso squashfs-tools rsync isolinux syslinux-common syslinux-utils imagemagick

      - name: Download Debian KDE Live
        run: |
          PAGE="https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/"
          ISO=$(curl -fsSL "$PAGE" | grep -o 'debian-live-[^"]*-amd64-kde.iso' | head -n 1)
          echo "ISO=$ISO"
          test -n "$ISO"
          wget -O base.iso "$PAGE/$ISO"

      - name: Extract ISO
        run: |
          mkdir iso-root
          xorriso -osirrox on -indev base.iso -extract / iso-root
          chmod -R u+w iso-root

      - name: Extract filesystem
        run: |
          sudo unsquashfs -d squashfs-root iso-root/live/filesystem.squashfs

      - name: Prepare NLOS assets
        run: |
          mkdir -p build-assets

          # Convertit le logo JPEG en PNG pour Plymouth/SDDM
          convert nlos/assets/boot-logo.jpeg -resize 360x360 -background none -gravity center -extent 360x360 build-assets/logo.png

          # Background sombre login
          convert -size 1920x1080 gradient:"#050505-#111111" build-assets/login-background.png

      - name: Fix APT sources
        run: |
          sudo rm -f squashfs-root/etc/apt/sources.list
          sudo mkdir -p squashfs-root/etc/apt/sources.list.d
          sudo find squashfs-root/etc/apt/sources.list.d -type f -delete || true

          sudo tee squashfs-root/etc/apt/sources.list >/dev/null <<'APT'
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          APT

          sudo cp /etc/resolv.conf squashfs-root/etc/resolv.conf

      - name: Install NLOS packages
        run: |
          sudo mount --bind /dev squashfs-root/dev
          sudo mount --bind /proc squashfs-root/proc
          sudo mount --bind /sys squashfs-root/sys

          sudo chroot squashfs-root /bin/bash -c "
            apt clean
            apt update
            apt install -y plymouth plymouth-themes sddm qml-module-qtquick-controls2 qml-module-qtquick-layouts
          "

          sudo umount -lf squashfs-root/dev || true
          sudo umount -lf squashfs-root/proc || true
          sudo umount -lf squashfs-root/sys || true

      - name: Install NLOS boot theme
        run: |
          sudo mkdir -p squashfs-root/usr/share/plymouth/themes/nlos
          sudo cp nlos/boot/nlos.plymouth squashfs-root/usr/share/plymouth/themes/nlos/nlos.plymouth
          sudo cp nlos/boot/nlos.script squashfs-root/usr/share/plymouth/themes/nlos/nlos.script
          sudo cp build-assets/logo.png squashfs-root/usr/share/plymouth/themes/nlos/logo.png

      - name: Install NLOS login theme
        run: |
          sudo mkdir -p squashfs-root/usr/share/sddm/themes/nlos
          sudo cp nlos/login/theme.conf squashfs-root/usr/share/sddm/themes/nlos/theme.conf
          sudo cp nlos/login/Main.qml squashfs-root/usr/share/sddm/themes/nlos/Main.qml
          sudo cp build-assets/logo.png squashfs-root/usr/share/sddm/themes/nlos/logo.png
          sudo cp build-assets/login-background.png squashfs-root/usr/share/sddm/themes/nlos/background.png

          sudo mkdir -p squashfs-root/etc/sddm.conf.d
          sudo tee squashfs-root/etc/sddm.conf.d/nlos.conf >/dev/null <<'SDDM'
          [Theme]
          Current=nlos

          [Autologin]
          Relogin=false
          SDDM

      - name: Add firstboot script
        run: |
          sudo mkdir -p squashfs-root/usr/local/bin
          sudo cp nlos/scripts/nlos-firstboot squashfs-root/usr/local/bin/nlos-firstboot
          sudo chmod +x squashfs-root/usr/local/bin/nlos-firstboot

          sudo mkdir -p squashfs-root/etc/skel/.config/autostart

          sudo tee squashfs-root/etc/skel/.config/autostart/nlos-firstboot.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NLOS First Boot
          Exec=nlos-firstboot
          Hidden=false
          NoDisplay=true
          X-GNOME-Autostart-enabled=true
          DESKTOP

      - name: Rebrand visible system
        run: |
          sudo tee squashfs-root/etc/hostname >/dev/null <<'HOST'
          nlos
          HOST

          sudo tee squashfs-root/etc/issue >/dev/null <<'ISSUE'
          NLOS \n \l
          ISSUE

          sudo sed -i 's/Debian/NLOS/g; s/debian/NLOS/g' squashfs-root/etc/os-release || true

          sudo rm -f squashfs-root/etc/skel/Desktop/Install*.desktop || true
          sudo rm -f squashfs-root/etc/skel/Desktop/Debian*.desktop || true
          sudo rm -f squashfs-root/usr/share/applications/*debian*installer*.desktop || true
          sudo rm -f squashfs-root/usr/share/applications/*calamares*.desktop || true

      - name: Enable Plymouth
        run: |
          sudo mount --bind /dev squashfs-root/dev
          sudo mount --bind /proc squashfs-root/proc
          sudo mount --bind /sys squashfs-root/sys

          sudo chroot squashfs-root /bin/bash -c "
            update-alternatives --install /usr/share/plymouth/themes/default.plymouth default.plymouth /usr/share/plymouth/themes/nlos/nlos.plymouth 200
            update-alternatives --set default.plymouth /usr/share/plymouth/themes/nlos/nlos.plymouth
            update-initramfs -u || true
          "

          sudo umount -lf squashfs-root/dev || true
          sudo umount -lf squashfs-root/proc || true
          sudo umount -lf squashfs-root/sys || true

      - name: Create NLOS boot menu
        run: |
          sudo mkdir -p iso-root/boot/grub

          sudo tee iso-root/boot/grub/grub.cfg >/dev/null <<'GRUB'
          set default=0
          set timeout=2

          insmod all_video
          insmod gfxterm
          set gfxmode=auto
          terminal_output gfxterm

          set menu_color_normal=white/black
          set menu_color_highlight=black/white

          menuentry "NLOS Premium" {
            linux /live/vmlinuz boot=live components quiet splash loglevel=0 systemd.show_status=false rd.udev.log_priority=3 vt.global_cursor_default=0 username=user hostname=nlos
            initrd /live/initrd.img
          }

          menuentry "NLOS Premium Safe Graphics" {
            linux /live/vmlinuz boot=live components nomodeset quiet splash loglevel=0 systemd.show_status=false rd.udev.log_priority=3 vt.global_cursor_default=0 username=user hostname=nlos
            initrd /live/initrd.img
          }
          GRUB

          sudo find iso-root -type f \( -name "*.cfg" -o -name "*.txt" \) -exec sed -i 's/Debian/NLOS/g; s/debian/NLOS/g' {} \; || true

      - name: Repack filesystem
        run: |
          sudo rm -f iso-root/live/filesystem.squashfs
          sudo mksquashfs squashfs-root iso-root/live/filesystem.squashfs -comp xz
          sudo du -sx --block-size=1 squashfs-root | cut -f1 | sudo tee iso-root/live/filesystem.size

      - name: Build ISO
        run: |
          cd iso-root
          sudo xorriso -as mkisofs \
            -r -V "NLOS_PREMIUM" \
            -o ../NLOS-Premium.iso \
            -J -joliet-long \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -partition_offset 16 \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NLOS-Premium
          path: NLOS-Premium.iso
