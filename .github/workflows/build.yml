name: Build NLOS Lite Alpha 4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt update
          sudo apt install -y xorriso squashfs-tools rsync wget isolinux syslinux-common syslinux-utils

      - name: Download Debian Live XFCE ISO
        run: |
          wget -O debian-live.iso https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/debian-live-13.4.0-amd64-xfce.iso

      - name: Extract ISO
        run: |
          mkdir iso-root
          xorriso -osirrox on -indev debian-live.iso -extract / iso-root
          chmod -R u+w iso-root

      - name: Extract filesystem
        run: |
          sudo unsquashfs -d squashfs-root iso-root/live/filesystem.squashfs

      - name: Add NLOS core
        run: |
          sudo mkdir -p squashfs-root/opt/nl-os
          sudo cp -R nl-os/* squashfs-root/opt/nl-os/

          sudo mkdir -p squashfs-root/usr/local/bin
          sudo cp nl-os/scripts/nlos-boost squashfs-root/usr/local/bin/nlos-boost
          sudo cp nl-os/scripts/nlos-game-run squashfs-root/usr/local/bin/nlos-game-run
          sudo cp nl-os/scripts/nlos-info squashfs-root/usr/local/bin/nlos-info
          sudo cp nl-os/scripts/nlos-center squashfs-root/usr/local/bin/nlos-center
          sudo chmod +x squashfs-root/usr/local/bin/nlos-boost
          sudo chmod +x squashfs-root/usr/local/bin/nlos-game-run
          sudo chmod +x squashfs-root/usr/local/bin/nlos-info
          sudo chmod +x squashfs-root/usr/local/bin/nlos-center

      - name: Add NLOS first boot configuration
        run: |
          sudo mkdir -p squashfs-root/etc/skel/.config/autostart
          sudo mkdir -p squashfs-root/etc/skel/Desktop
          sudo mkdir -p squashfs-root/etc/skel/.local/share/applications

          sudo tee squashfs-root/etc/skel/.local/share/applications/nlos-center.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NLOS Center
          Exec=nlos-center
          Icon=applications-system
          Terminal=false
          Categories=System;
          DESKTOP

          sudo tee squashfs-root/etc/skel/Desktop/NLOS-Center.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NLOS Center
          Exec=nlos-center
          Icon=applications-system
          Terminal=false
          Categories=System;
          DESKTOP

          sudo chmod +x squashfs-root/etc/skel/Desktop/NLOS-Center.desktop

          sudo tee squashfs-root/etc/skel/.config/autostart/nlos-center.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=NLOS Center
          Exec=nlos-center
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          DESKTOP

          sudo tee squashfs-root/etc/hostname >/dev/null <<'HOST'
          nlos
          HOST

          sudo tee squashfs-root/etc/issue >/dev/null <<'ISSUE'
          NLOS Lite Alpha 4 \n \l
          ISSUE

      - name: Replace boot menu text
        run: |
          sudo find iso-root -type f \( -name "*.cfg" -o -name "*.txt" \) -exec sed -i 's/Debian GNU\/Linux/NLOS Lite Alpha 4/g; s/Debian Live/NLOS Lite Alpha 4/g; s/debian/NLOS/g; s/Debian/NLOS/g' {} \; || true
          sudo find iso-root -type f \( -name "*.cfg" -o -name "*.txt" \) -exec sed -i 's/Live system (amd64)/NLOS Live/g; s/Start installer/NLOS Installer/g' {} \; || true

      - name: Repack filesystem
        run: |
          sudo rm -f iso-root/live/filesystem.squashfs
          sudo mksquashfs squashfs-root iso-root/live/filesystem.squashfs -comp xz
          sudo du -sx --block-size=1 squashfs-root | cut -f1 | sudo tee iso-root/live/filesystem.size

      - name: Build bootable ISO
        run: |
          cd iso-root
          sudo xorriso -as mkisofs \
            -r -V "NLOS_LITE_A4" \
            -o ../NLOS-Lite-Alpha-4.iso \
            -J -joliet-long \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -partition_offset 16 \
            -b isolinux/isolinux.bin \
            -c isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            .

      - name: Upload NLOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: NLOS-Lite-Alpha-4
          path: NLOS-Lite-Alpha-4.iso
